<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Global Giveaway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Narrow', Arial, sans-serif;
        }
        
        /* পুরো স্ক্রিনটাই একটা সিঙ্গেল পেজ - কোন আলাদা বক্স নাই */
        body {
            background: radial-gradient(circle, #ffffff 30%, #e4e9ed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 0 30px 0;
            position: relative;
            overflow-x: hidden;
        }

        /* --- পুরো পেজ জুড়ে ব্যাকগ্রাউন্ডে টাকার লাইভ ইফেক্ট --- */
        .money-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1; /* এটা কন্টেন্টের নিচে থাকবে */
        }
        .bill {
            position: absolute;
            width: 45px;
            height: 22px;
            background: #a3cb8c;
            border: 1px solid #6b9c54;
            border-radius: 2px;
            opacity: 0.25;
            animation: fall linear infinite;
        }
        .bill::after {
            content: '$';
            position: absolute;
            font-size: 11px;
            font-weight: bold;
            color: #436a31;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            15% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .bill:nth-child(1) { left: 10%; animation-duration: 7s; animation-delay: 0s; }
        .bill:nth-child(2) { left: 25%; animation-duration: 9s; animation-delay: 2s; }
        .bill:nth-child(3) { left: 50%; animation-duration: 6s; animation-delay: 1s; }
        .bill:nth-child(4) { left: 75%; animation-duration: 8s; animation-delay: 3s; }
        .bill:nth-child(5) { left: 90%; animation-duration: 7s; animation-delay: 0.5s; }

        /* --- ল্যান্ডিং পেজের কন্টেন্ট লেআউট (সব এক লাইনে সরাসরি পেজে থাকবে) --- */
        .top-bar {
            background-color: #212121;
            color: #ffffff;
            text-align: center;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            width: 100%;
            z-index: 10;
        }

        .main-container {
            width: 100%;
            max-width: 365px; /* মোবাইলের জন্য পারফেক্ট সাইজ */
            padding: 25px 16px;
            text-align: center;
            z-index: 10; /* কন্টেন্ট যেন টাকার ওপরে ক্লিয়ার থাকে */
        }

        .main-headline {
            font-size: 38px;
            font-weight: 900;
            color: #1a1a1a;
            line-height: 1.05;
            text-transform: uppercase;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* আইকন ও টাইমার সেকশন */
        .middle-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 0 4px;
        }
        
        .icon-area {
            width: 35%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        
        .timer-area {
            width: 60%;
            text-align: left;
        }
        
        .timer-title {
            font-size: 14px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .timer-wrapper {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        
        .time-box {
            background-color: #244d6c; /* ১ম ছবির সেই অরিজিনাল ব্লু */
            color: #ffffff;
            border-radius: 4px;
            min-width: 42px;
            padding: 6px 0;
            text-align: center;
        }
        
        .time-digits {
            font-size: 18px;
            font-weight: bold;
            display: block;
            line-height: 1;
        }
        
        .time-label {
            font-size: 8px;
            color: #cfd8dc;
            text-transform: uppercase;
            margin-top: 2px;
            display: block;
        }
        
        .timer-colon {
            font-size: 18px;
            font-weight: bold;
            color: #244d6c;
        }

        .notice-tag {
            background: linear-gradient(180deg, #37474f 0%, #212121 100%);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 0;
            border-radius: 25px;
            width: 100%;
            display: block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* --- ১ম ইমেজের সেই অরিজিনাল বাটন ডিজাইন --- */
        .btn-blue {
            background-color: #1e4b6c;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 14px 10px;
            border: none;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        .btn-claim-box {
            background: linear-gradient(180deg, #b0bec5 0%, #78909c 100%);
            border: 1px solid #90a4ae;
            border-radius: 6px;
            width: 100%;
            padding: 12px 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .claim-word {
            font-size: 24px;
            font-weight: bold;
            color: #212121;
            padding-right: 12px;
            border-right: 1px solid #546e7a;
            text-transform: uppercase;
        }
        
        .claim-text {
            font-size: 15px;
            font-weight: bold;
            color: #212121;
            padding-left: 12px;
            text-transform: uppercase;
            text-align: left;
            line-height: 1.1;
        }

        /* ফুটার */
        .footer-section {
            text-align: center;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid #cfd8dc;
        }
        .cpa-badge {
            background-color: #212121;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .footer-desc {
            font-size: 11px;
            color: #64748b;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="money-container">
        <div class="bill"></div>
        <div class="bill"></div>
        <div class="bill"></div>
        <div class="bill"></div>
        <div class="bill"></div>
    </div>

    <div class="top-bar">OFFICIAL GLOBAL GIVEAWAY</div>

    <div class="main-container">
        <h1 class="main-headline">
            WIN $5,000<br>CASH!
        </h1>

        <div class="middle-section">
            <div class="icon-area">
                <svg width="45" height="25" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="3">
                    <path d="M23 6l-9.5 9.5-5-5L1 18"></path>
                    <path d="M17 6h6v6"></path>
                </svg>
                <svg width="60" height="32" viewBox="0 0 24 24">
                    <rect x="2" y="5" width="20" height="13" rx="2" fill="#78909c"/>
                    <circle cx="12" cy="11" r="3" fill="#cfd8dc"/>
                </svg>
            </div>

            <div class="timer-area">
                <p class="timer-title">Time Remaining:</p>
                <div class="timer-wrapper">
                    <div class="time-box"><span class="time-digits" id="days">02</span><span class="time-label">Days:</span></div>
                    <div class="timer-colon">:</div>
                    <div class="time-box"><span class="time-digits" id="mins">45</span><span class="time-label">Mins:</span></div>
                    <div class="timer-colon">:</div>
                    <div class="time-box"><span class="time-digits" id="secs">53</span><span class="time-label">Secs</span></div>
                </div>
            </div>
        </div>

        <div class="notice-tag">Entries Filling Fast - Act Now!</div>

        <button class="btn-blue" onclick="goToOffer()">
            Get Free Bonus Entries & Prize Entry
        </button>

        <div class="btn-claim-box" onclick="goToOffer()">
            <div class="claim-word">Claim</div>
            <div class="claim-text">Claim Your<br>Cash Prize Now!</div>
        </div>

        <div class="footer-section">
            <span class="cpa-badge">CPA</span>
            <p class="footer-desc">
                Exclusive High-Tier CPA Offer: Join the Sweepstakes and Win BIG! Verify Your Account for Verified Entry.
            </p>
        </div>
    </div>

    <script>
        // লাইভ টাইমার স্ক্রিপ্ট
        let totalSeconds = (2 * 24 * 3600) + (45 * 60) + 53;
        function updateTimer() {
            if(totalSeconds <= 0) totalSeconds = 200000;
            totalSeconds--;
            let d = Math.floor(totalSeconds / (3600*24));
            let m = Math.floor((totalSeconds % (3600*24)) / 60) % 60;
            let s = totalSeconds % 60;
            document.getElementById('days').innerText = d < 10 ? '0'+d : d;
            document.getElementById('mins').innerText = m < 10 ? '0'+m : m;
            document.getElementById('secs').innerText = s < 10 ? '0'+s : s;
        }
        setInterval(updateTimer, 1000);

        function goToOffer() {
            window.location.href = "YOUR_CPA_OFFER_LINK_HERE";
        }
    </script>
</body>
</html>
