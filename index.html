<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Global Giveaway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Narrow', Arial, sans-serif;
        }
        
        body {
            background-color: #e4e9ed; /* ১ম ছবির সেই হালকা অফ-হোয়াইট/গ্রে ব্যাকগ্রাউন্ড */
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* --- মানি ইফেক্ট কন্টেইনার (কার্ডের পেছনে থাকবে) --- */
        .money-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .bill {
            position: absolute;
            width: 45px;
            height: 22px;
            background: #a3cb8c;
            border: 1px solid #6b9c54;
            border-radius: 2px;
            opacity: 0.35;
            animation: fall linear infinite;
        }
        .bill::after {
            content: '$';
            position: absolute;
            font-size: 11px;
            font-weight: bold;
            color: #436a31;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            15% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .bill:nth-child(1) { left: 8%; animation-duration: 6s; animation-delay: 0s; }
        .bill:nth-child(2) { left: 22%; animation-duration: 8s; animation-delay: 2s; }
        .bill:nth-child(3) { left: 40%; animation-duration: 5s; animation-delay: 1s; }
        .bill:nth-child(4) { left: 78%; animation-duration: 7s; animation-delay: 3s; }
        .bill:nth-child(5) { left: 92%; animation-duration: 6s; animation-delay: 0.5s; }

        /* --- ১ম ইমেজের হুবহু ফিক্সড মোবাইল কার্ড --- */
        .phone-mockup {
            width: 100%;
            max-width: 360px;
            background: #ffffff; /* কার্ডের ভেতরের ব্যাকগ্রাউন্ড হুবহু সাদা */
            border: 1px solid #b0bec5;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            z-index: 10; /* কার্ডটি টাকার ইফেক্টের উপরে থাকবে */
        }
        
        .top-bar {
            background-color: #212121;
            color: #ffffff;
            text-align: center;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 22px 16px;
            text-align: center;
        }

        /* শর্টকাট প্রফেশনাল হেডলাইন */
        .main-headline {
            font-size: 40px;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1.05;
            text-transform: uppercase;
            margin-bottom: 22px;
            letter-spacing: -0.5px;
        }

        /* মিডেল সেকশন লেআউট */
        .middle-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding: 0 5px;
        }
        
        .icon-area {
            width: 35%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .timer-area {
            width: 60%;
            text-align: left;
        }
        
        .timer-title {
            font-size: 14px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .timer-wrapper {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        
        .time-box {
            background-color: #244d6c; /* ১ম ছবির সেই নেভি ব্লু */
            color: #ffffff;
            border-radius: 4px;
            min-width: 42px;
            padding: 6px 0;
            text-align: center;
        }
        
        .time-digits {
            font-size: 18px;
            font-weight: bold;
            display: block;
            line-height: 1;
        }
        
        .time-label {
            font-size: 8px;
            color: #cfd8dc;
            text-transform: uppercase;
            margin-top: 2px;
            display: block;
        }
        
        .timer-colon {
            font-size: 18px;
            font-weight: bold;
            color: #244d6c;
        }

        .notice-tag {
            background: linear-gradient(180deg, #37474f 0%, #212121 100%);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 5px 0;
            border-radius: 25px;
            width: 100%;
            display: block;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        /* --- ১ম ইমেজের সেই অরিজিনাল ব্লু বাটন --- */
        .btn-blue {
            background-color: #1e4b6c;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 14px 10px;
            border: none;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        /* --- ১ম ইমেজের সেই অরিজিনাল মেটালিক গ্রে বাটন --- */
        .btn-claim-box {
            background: linear-gradient(180deg, #b0bec5 0%, #78909c 100%);
            border: 1px solid #90a4ae;
            border-radius: 6px;
            width: 100%;
            padding: 12px 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .claim-word {
            font-size: 24px;
            font-weight: bold;
            color: #212121;
            padding-right: 12px;
            border-right: 1px solid #546e7a;
            text-transform: uppercase;
        }
        
        .claim-text {
            font-size: 15px;
            font-weight: bold;
            color: #212121;
            padding-left: 12px;
            text-transform: uppercase;
            text-align: left;
            line-height: 1.1;
        }

        /* ফুটার */
        .footer-section {
            background-color: #f1f5f9;
            padding: 15px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        .cpa-badge {
            background-color: #212121;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .footer-desc {
            font-size: 11px;
            color: #64748b;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="money-container">
        <div class="bill"></div>
        <div class="bill"></div>
        <div class="bill"></div>
        <div class="bill"></div>
        <div class="bill"></div>
    </div>

    <div class="phone-mockup">
        <div class="top-bar">OFFICIAL GLOBAL GIVEAWAY</div>

        <div class="content">
            <h1 class="main-headline">
                WIN $5,000<br>CASH!
            </h1>

            <div class="middle-section">
                <div class="icon-area">
                    <svg width="45" height="25" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="3">
                        <path d="M23 6l-9.5 9.5-5-5L1 18"></path>
                        <path d="M17 6h6v6"></path>
                    </svg>
                    <svg width="60" height="32" viewBox="0 0 24 24">
                        <rect x="2" y="5" width="20" height="13" rx="2" fill="#78909c"/>
                        <circle cx="12" cy="11" r="3" fill="#cfd8dc"/>
                    </svg>
                </div>

                <div class="timer-area">
                    <p class="timer-title">Time Remaining:</p>
                    <div class="timer-wrapper">
                        <div class="time-box"><span class="time-digits" id="days">02</span><span class="time-label">Days:</span></div>
                        <div class="timer-colon">:</div>
                        <div class="time-box"><span class="time-digits" id="mins">45</span><span class="time-label">Mins:</span></div>
                        <div class="timer-colon">:</div>
                        <div class="time-box"><span class="time-digits" id="secs">58</span><span class="time-label">Secs</span></div>
                    </div>
                </div>
            </div>

            <div class="notice-tag">Entries Filling Fast - Act Now!</div>

            <button class="btn-blue" onclick="goToOffer()">
                Get Free Bonus Entries & Prize Entry
            </button>

            <div class="btn-claim-box" onclick="goToOffer()">
                <div class="claim-word">Claim</div>
                <div class="claim-text">Claim Your<br>Cash Prize Now!</div>
            </div>
        </div>

        <div class="footer-section">
            <span class="cpa-badge">CPA</span>
            <p class="footer-desc">
                Exclusive High-Tier CPA Offer: Join the Sweepstakes and Win BIG! Verify Your Account for Verified Entry.
            </p>
        </div>
    </div>

    <script>
        // লাইভ টাইমার স্ক্রিপ্ট
        let totalSeconds = (2 * 24 * 3600) + (45 * 60) + 58;
        function updateTimer() {
            if(totalSeconds <= 0) totalSeconds = 200000;
            totalSeconds--;
            let d = Math.floor(totalSeconds / (3600*24));
            let m = Math.floor((totalSeconds % (3600*24)) / 60) % 60;
            let s = totalSeconds % 60;
            document.getElementById('days').innerText = d < 10 ? '0'+d : d;
            document.getElementById('mins').innerText = m < 10 ? '0'+m : m;
            document.getElementById('secs').innerText = s < 10 ? '0'+s : s;
        }
        setInterval(updateTimer, 1000);

        function goToOffer() {
            window.location.href = "YOUR_CPA_OFFER_LINK_HERE";
        }
    </script>
</body>
</html>
